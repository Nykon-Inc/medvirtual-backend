name: Build, Push & Deploy

on:
  push:
    branches:
      - development

env:
  DEPLOY_PATH: /home/ec2-user/medvirtual-backend
  PM2_APP_NAME: medvirtual-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Package release
        run: |
          mkdir -p release/prisma
          cp -r dist package.json package-lock.json release/
          cp -r prisma/schema.prisma prisma/migrations release/prisma/
          tar -czf release.tar.gz -C release .

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SERVER_SSH_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -H "${{ secrets.STAGING_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp release.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}:/home/ec2-user/release.tar.gz"

      # dist/, package.json, package-lock.json and prisma/ are replaced on every deploy;
      # the persisted .env in $DEPLOY_PATH is never touched. node_modules is installed
      # on the server itself (not shipped from CI) so native deps like @napi-rs/canvas
      # get binaries matching this box's actual platform/arch, not the GitHub runner's.
      # Migrations run here too, using the server's own .env, since the DB is only
      # reachable from inside the VPC.
      - name: Extract, install, migrate & restart on server
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}" '
            set -e
            mkdir -p "${{ env.DEPLOY_PATH }}"
            cd "${{ env.DEPLOY_PATH }}"
            rm -rf dist package.json package-lock.json prisma
            tar -xzf /home/ec2-user/release.tar.gz -C "${{ env.DEPLOY_PATH }}"
            rm -f /home/ec2-user/release.tar.gz
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            if pm2 describe "${{ env.PM2_APP_NAME }}" > /dev/null 2>&1; then
              pm2 reload "${{ env.PM2_APP_NAME }}" --update-env
            else
              pm2 start dist/main.js --name "${{ env.PM2_APP_NAME }}" --cwd "${{ env.DEPLOY_PATH }}"
            fi
            pm2 save
          '

      # Binds Candidate.hubstaff_id (and backfills Candidate.hubspot_vaid) by matching
      # the VA ID on each Hubstaff profile against HubSpot's vaid. Hubstaff profiles and
      # HubSpot records drift between deploys and nothing else reconciles them, so
      # this runs every time rather than on a schedule.
      #
      # POST /hubstaff/sync only ENQUEUES onto the hubstaff-sync queue, so this step
      # confirms the job was accepted; the per-candidate summary goes to whichever
      # process consumes it. AppModule registers the processor in both dist/main.js
      # and dist/worker.js, and this workflow only manages the former — so `pm2 logs`
      # unqualified, rather than naming a process that may not be the consumer.
      #
      # continue-on-error: a HubSpot/Hubstaff outage must not red-X a deploy whose
      # code shipped fine. The reconcile is idempotent and runs again next deploy.
      - name: Trigger Hubstaff ID reconcile
        continue-on-error: true
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}" '
            set -e
            cd "${{ env.DEPLOY_PATH }}"

            # The app binds to PORT from the persisted .env, defaulting to 3000 the
            # same way main.ts does. Read rather than hardcoded so a port change in
            # .env does not silently turn this step into a no-op.
            PORT=$(sed -n -E "s/^PORT=[^0-9]*([0-9]+).*/\1/p" .env 2>/dev/null | tail -n1)
            PORT=${PORT:-3000}
            BASE="http://127.0.0.1:$PORT"

            # pm2 reload returns before Nest finishes booting, so poll the health
            # endpoint instead of sleeping a fixed guess.
            echo "Waiting for the API to come up on port $PORT..."
            READY=no
            for i in $(seq 1 45); do
              if curl -fsS -m 5 "$BASE/start" > /dev/null 2>&1; then
                READY=yes
                break
              fi
              sleep 2
            done

            # Checked after the loop rather than on the last iteration: an inline
            # "$i -eq 45" guard silently stops firing the moment the bound above
            # is edited, and the step then falls through to curl a dead port.
            if [ "$READY" != yes ]; then
              echo "API did not answer $BASE/start in time — skipping reconcile."
              exit 1
            fi
            echo "API is live."

            echo "Triggering Hubstaff reconcile..."
            RESPONSE=$(curl -fsS -m 60 -X POST "$BASE/hubstaff/sync")
            echo "Response: $RESPONSE"

            # Queues are what actually run the job; if they are disabled the
            # endpoint returns a no-op message and nothing gets reconciled.
            case "$RESPONSE" in
              *"Queue not available"*)
                echo "Queues are disabled on this host — reconcile did NOT run."
                exit 1
                ;;
            esac

            echo "Reconcile queued. Summary: pm2 logs --lines 200"
          '
